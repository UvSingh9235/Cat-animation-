<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Neko For You 🐱</title>
    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Speech Bubble */
        .bubble-container {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 320px;
        }

        .speech-bubble {
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            text-align: center;
            font-weight: 600;
            color: #ff4d6d;
            position: relative;
            font-size: 1rem;
            animation: float 3s ease-in-out infinite;
            width: 100%;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-50px); }
        }

        /* Pure CSS Cute Cat Animation */
        .cat-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            margin-bottom: 40px;
        }

        .cat-body {
            position: absolute;
            bottom: 0;
            width: 140px;
            height: 120px;
            background: #ffffff;
            border-radius: 70px 70px 60px 60px;
            left: 30px;
            box-shadow: inset -10px -10px 0 #f0f0f0;
        }

        .cat-head {
            position: absolute;
            top: 20px;
            width: 130px;
            height: 100px;
            background: #ffffff;
            border-radius: 50% 50% 45% 45%;
            left: 35px;
            box-shadow: inset -8px -4px 0 #f0f0f0;
        }

        .ear {
            position: absolute;
            top: -12px;
            width: 40px;
            height: 45px;
            background: #ffffff;
            border-radius: 50% 50% 0 0;
        }
        .ear.left {
            left: 5px;
            transform: rotate(-25deg);
        }
        .ear.right {
            right: 5px;
            transform: rotate(25deg);
        }
        .ear-inner {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 24px;
            height: 30px;
            background: #ffccd5;
            border-radius: 50% 50% 0 0;
        }

        .eye {
            position: absolute;
            top: 42px;
            width: 12px;
            height: 12px;
            background: #2b2b2b;
            border-radius: 50%;
            animation: blink 4s infinite;
        }
        .eye.left { left: 30px; }
        .eye.right { right: 30px; }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .blush {
            position: absolute;
            top: 54px;
            width: 16px;
            height: 8px;
            background: #ffb3c1;
            border-radius: 50%;
            opacity: 0.8;
        }
        .blush.left { left: 18px; }
        .blush.right { right: 18px; }

        .nose {
            position: absolute;
            top: 50px;
            left: 61px;
            width: 8px;
            height: 6px;
            background: #ff758f;
            border-radius: 50%;
        }

        .tail {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 20px;
            height: 60px;
            background: #ffffff;
            border-radius: 10px;
            transform-origin: bottom center;
            animation: wag 2.5s ease-in-out infinite;
            box-shadow: inset -4px 0 0 #f0f0f0;
        }

        @keyframes wag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
        }

        /* Action Buttons */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .btn {
            background: white;
            border: none;
            padding: 12px 8px;
            border-radius: 15px;
            font-weight: 700;
            color: #ff4d6d;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(255, 77, 109, 0.15);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.85rem;
        }

        .btn span:first-child {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 4px rgba(255, 77, 109, 0.15);
        }

        /* Hearts Particle Effect */
        .heart {
            position: absolute;
            font-size: 24px;
            color: #ff4d6d;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Chat Text Container -->
    <div class="bubble-container">
        <div class="speech-bubble" id="speech-text">Halo! Meow~ Tap me or use buttons! ✨</div>
    </div>

    <!-- The Cute Cat Area -->
    <div class="cat-container" onclick="petCat(event)">
        <div class="tail"></div>
        <div class="cat-body"></div>
        <div class="cat-head">
            <div class="ear left"><div class="ear-inner"></div></div>
            <div class="ear-right ear"><div class="ear-inner"></div></div>
            <div class="eye left" id="eye-l"></div>
            <div class="eye right" id="eye-r"></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="nose"></div>
        </div>
    </div>

    <!-- Dynamic Action Buttons -->
    <div class="buttons-grid">
        <button class="btn" onclick="feedCat(event)">
            <span>🐟</span>
            <span>Feed Me</span>
        </button>
        <button class="btn" onclick="petCat(event)">
            <span>🐾</span>
            <span>Pet Me</span>
        </button>
        <button class="btn" onclick="talkCat()">
            <span>💬</span>
            <span>Talk</span>
        </button>
    </div>

    <script>
        const speechText = document.getElementById('speech-text');

        // Dialogues Arrays (Perfect translations)
        const greetingMessages = [
            "Halo! Aku senang sekali kamu datang! 🥰", // Indonesian: Hello! I'm so glad you came!
            "Matur nuwun sudah mampir ya! ✨", // Javanese mixed: Thank you for dropping by!
            "Meow~ Kamu sudah senyum belum hari ini? 🌸" // Indonesian: Meow~ Have you smiled today?
        ];

        const foodMessages = [
            "Nyam nyam.. Enak banget! Matur nuwun! 🐟❤️", // Javanese/Indo: Yum yum.. So delicious! Thank you!
            "Ayam/Ikan ini enak! Kamu perhatian banget deh~ 🥰", // Indonesian: This chicken/fish is good! You are so attentive~
            "Nyam! Perutku gendut sekarang, hehe~ 🐱" // Indonesian: Yum! My belly is chubby now, hehe~
        ];

        const petMessages = [
            "Aaaww.. nyaman banget~ Purr... 💕", // Indonesian: Aaaww.. so comfortable~ Purr...
            "Aku suka dielus sama kamu! Jangan berhenti ya~ 🥰", // Indonesian: I love being petted by you! Don't stop~
            "Kamu baik banget, makasih ya temanku! 🌸" // Indonesian: You are so kind, thank you my friend!
        ];

        // Function to produce Hearts
        function spawnHearts(e) {
            let x, y;
            if(e) {
                x = e.clientX;
                y = e.clientY;
            } else {
                // If clicked via button, spawn near the cat head
                x = window.innerWidth / 2;
                y = window.innerHeight / 2 - 20;
            }

            for(let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = (x - 10 + (Math.random() * 40 - 20)) + 'px';
                heart.style.top = (y - 10 + (Math.random() * 40 - 20)) + 'px';
                
                // Randomize slightly for dynamic look
                heart.style.animationDelay = (Math.random() * 0.2) + 's';
                
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1000);
            }
        }

        // Action: Talk
        function talkCat() {
            const randomIdx = Math.floor(Math.random() * greetingMessages.length);
            speechText.innerText = greetingMessages[randomIdx];
        }

        // Action: Feed
        function feedCat(e) {
            spawnHearts(e);
            const randomIdx = Math.floor(Math.random() * foodMessages.length);
            speechText.innerText = foodMessages[randomIdx];
        }

        // Action: Pet
        function petCat(e) {
            spawnHearts(e);
            const randomIdx = Math.floor(Math.random() * petMessages.length);
            speechText.innerText = petMessages[randomIdx];
            
            // Temporary happy eye look
            const el = document.getElementById('eye-l');
            const er = document.getElementById('eye-r');
            el.style.transform = 'scaleY(0.2)';
            er.style.transform = 'scaleY(0.2)';
            
            setTimeout(() => {
                el.style.transform = 'scaleY(1)';
                er.style.transform = 'scaleY(1)';
            }, 1500);
        }

        // Initial launch greeting
        window.onload = () => {
            setTimeout(() => {
                speechText.innerText = "Halo! Seseorang dari India mengirimku untuk menemanimu! 🐱✨"; 
                // Translation: Hello! Someone from India sent me to accompany you!
            }, 500);
        };
    </script>
</body>
</html>
